<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Bitcoin Risk Brief is a Bitcoin risk analytics and research signal for market context, not financial advice."
    />
    <link rel="canonical" href="https://bitcoinriskbrief.minihub.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bitcoin Risk Brief" />
    <meta
      property="og:description"
      content="Bitcoin Risk Brief is a Bitcoin risk analytics and research signal for market context, not financial advice."
    />
    <meta property="og:url" content="https://bitcoinriskbrief.minihub.app/" />
    <meta property="og:site_name" content="Bitcoin Risk Brief" />
    <meta property="og:image" content="https://bitcoinriskbrief.minihub.app/og-image.png" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:image:alt" content="Bitcoin Risk Brief — the risk scale from 0.00 to 1.00 with its low, neutral and high bands" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoin Risk Brief" />
    <meta
      name="twitter:description"
      content="Bitcoin Risk Brief is a Bitcoin risk analytics and research signal for market context, not financial advice."
    />
    <title>Bitcoin Risk Brief</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Bitcoin Risk Brief",
        "description": "A daily Bitcoin risk signal from 0.0 to 1.0 computed from canonical BTC/USD daily data, with its state, freshness, and the price scenarios that would move it into another band. Analytics and research context, not financial advice.",
        "url": "https://bitcoinriskbrief.minihub.app/",
        "usageInfo": "Owned source code, documentation, and configuration are Apache-2.0. Third-party BTC/USD market data is subject to source-provider terms. Analytics and research context, not financial advice.",
        "isAccessibleForFree": true,
        "creator": { "@type": "Person", "name": "Andrey Karazhev" },
        "temporalCoverage": "2010-07-13/..",
        "variableMeasured": [
          { "@type": "PropertyValue", "name": "risk", "description": "Modelled risk from 0.0 to 1.0" },
          { "@type": "PropertyValue", "name": "risk_state", "description": "low, neutral, or high" },
          { "@type": "PropertyValue", "name": "model_price_usd", "description": "HLC3 of the last completed daily candle" }
        ],
        "distribution": [
          {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://bitcoinriskbrief.minihub.app/api/risk/latest"
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Bitcoin Risk Brief",
        "url": "https://bitcoinriskbrief.minihub.app/",
        "inLanguage": ["en", "ru", "zh", "de", "fr", "es", "ar"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
