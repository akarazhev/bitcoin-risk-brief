version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      frontend-npm:
        patterns:
          - "*"

  # backend and collector are one ecosystem entry on purpose. They share pinned
  # dependencies (asyncpg, httpx) and CI installs both requirement files into a
  # single environment, so a bump in one file alone makes pip unsatisfiable.
  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/collector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      backend-container:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/collector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      collector-container:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      frontend-container:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns:
          - "*"
