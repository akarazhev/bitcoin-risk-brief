name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            collector/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r collector/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=backend:collector python -m unittest discover -s backend/tests -v

  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            collector/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r collector/requirements.txt
      - name: Run collector tests
        run: PYTHONPATH=backend:collector python -m unittest discover -s collector/tests -v

  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python3 -m compileall backend collector

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test frontend
        run: npm test --prefix frontend

  frontend-build:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  frontend-smoke:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium firefox webkit
      - name: Run frontend browser smoke checks
        run: npm run smoke --prefix frontend

  compose-validation:
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f podman-compose.yml config >/dev/null

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict

  docs-deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t brb-backend:ci ./backend
      - name: Backend imports
        run: docker run --rm brb-backend:ci python -c "import app.main"

      - name: Build collector image
        run: docker build -t brb-collector:ci -f ./collector/Dockerfile .
      - name: Collector imports
        run: docker run --rm brb-collector:ci python -c "import collector.main"

      - name: Build frontend image
        run: |
          docker build -t brb-frontend:ci \
            --build-arg VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            ./frontend
      # nginx.conf proxies to the compose service name "backend", which resolves
      # only inside the compose network. Point it at the loopback so nginx can
      # finish resolving upstreams and actually validate the rest of the file.
      - name: Frontend nginx config is valid
        run: docker run --rm --add-host backend:127.0.0.1 brb-frontend:ci nginx -t
