name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r collector/requirements.txt
      - name: Run backend tests
        run: PYTHONPATH=backend:collector python -m unittest discover -s backend/tests -v
      - name: Run collector tests
        run: PYTHONPATH=backend:collector python -m unittest discover -s collector/tests -v
      - name: Compile Python modules
        run: python -m compileall backend collector

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Test frontend
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f podman-compose.yml config >/dev/null
